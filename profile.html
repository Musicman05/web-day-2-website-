    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Developer Profile</title>
    <style>
      body {
        background-color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .profile-card {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        width: 340px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }

      /* Avatar Box with Gradient Border */
      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        color: #0f172a;
        margin: 0 auto 20px auto;
      }

      /* Typography */
      h1 {
        font-size: 1.5rem;
        margin: 0 0 6px 0;
        color: #ffffff;
      }

      .title {
        color: #38bdf8;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .bio {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 24px;
      }

      /* Skill Tags */
      .skills {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }

      .tag {
        background-color: #334155;
        color: #e2e8f0;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
      }

      /* Action Button */
      .btn-connect {
        display: block;
        background-color: #38bdf8;
        color: #0f172a;
        text-decoration: none;
        font-weight: bold;
        padding: 12px 0;
        border-radius: 8px;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }

      .btn-connect:hover {
        background-color: #0284c7;
        color: #ffffff;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <div class="avatar">TA</div>
      <h1>Tyler Anthony</h1>
      <div class="title">Singer-Songwriter-Pianist</div>
      <p class="bio">21 year old musician bringing vintage inspired music to the mainstream</p>

      <div class="skills">
        <span class="tag">HTML5</span>
        <span class="tag">CSS3</span>
        <span class="tag">JavaScript</span>
        <span class="tag">Git</span>
      </div>

      <a href="event.html" class="btn-connect">View Event</a>
    </div>
  </body>
</html>
